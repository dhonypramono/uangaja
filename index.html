<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Keuanganku</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Keuanganku">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14; --card:#121a21; --card2:#19232c; --line:#202c36; --text:#e9eff3; --muted:#8b9aa6; --faint:#5d6b76;
  --accent:#4cc9db; --accent-ink:#052e37; --accent-soft:rgba(76,201,219,.14);
  --pos:#7ddba0; --neg:#f98f80; --warn:#f5c26b; --neg-soft:rgba(249,143,128,.14); --pos-soft:rgba(125,219,160,.14);
  --btn:#e8eef2; --btn-ink:#0b1217; --bar2:#7d93a3; --shadow:0 18px 40px rgba(0,0,0,.45);
  --hero:linear-gradient(135deg,#0f4d59 0%,#13262e 62%,#121a21 100%);
  --scrim:rgba(4,8,11,.62); --nav:rgba(18,26,33,.92);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f6f8; --card:#ffffff; --card2:#edf2f5; --line:#dde5ea; --text:#12202a; --muted:#5f707c; --faint:#93a2ad;
  --accent:#0f9fb5; --accent-ink:#ffffff; --accent-soft:rgba(15,159,181,.12);
  --pos:#1b8f55; --neg:#d2503e; --warn:#b7791f; --neg-soft:rgba(210,80,62,.1); --pos-soft:rgba(27,143,85,.1);
  --btn:#12202a; --btn-ink:#ffffff; --bar2:#9db0bd; --shadow:0 18px 40px rgba(20,40,60,.14);
  --hero:linear-gradient(135deg,#d3f1f6 0%,#eaf6f8 70%,#ffffff 100%);
  --scrim:rgba(20,35,45,.4); --nav:rgba(255,255,255,.94); color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme=auto]{
    --bg:#f3f6f8; --card:#ffffff; --card2:#edf2f5; --line:#dde5ea; --text:#12202a; --muted:#5f707c; --faint:#93a2ad;
    --accent:#0f9fb5; --accent-ink:#ffffff; --accent-soft:rgba(15,159,181,.12);
    --pos:#1b8f55; --neg:#d2503e; --warn:#b7791f; --neg-soft:rgba(210,80,62,.1); --pos-soft:rgba(27,143,85,.1);
    --btn:#12202a; --btn-ink:#ffffff; --bar2:#9db0bd; --shadow:0 18px 40px rgba(20,40,60,.14);
    --hero:linear-gradient(135deg,#d3f1f6 0%,#eaf6f8 70%,#ffffff 100%);
    --scrim:rgba(20,35,45,.4); --nav:rgba(255,255,255,.94); color-scheme:light;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.35}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
svg.i.l{width:26px;height:26px}
.app{max-width:480px;margin:0 auto;padding:0 16px 128px;min-height:100vh}
.app.sub{padding-bottom:48px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.sm{font-size:13px} .xs{font-size:12px}
.hide-amt .chart{filter:blur(7px)}

/* header */
.top{display:flex;align-items:center;gap:12px;height:76px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);margin:0 -16px;padding:0 16px}
.top h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;flex:1}
.top h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;flex:1}
.top .sp{flex:1}
.logo{width:34px;height:34px;color:var(--accent)}
.pill{height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.pill.act{border-color:var(--accent)}
.pill.sm{height:34px;padding:0 14px;font-size:14px;font-weight:500}
.iconbtn{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:active{background:var(--card2)}
.back{margin-left:-8px;color:var(--text)}

/* kartu */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.card.flush{padding:0;overflow:hidden}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:26px;padding:20px 22px}
.hero .lbl{color:var(--muted);font-size:15px;display:flex;justify-content:space-between;align-items:center}
.hero .big{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:8px 0 14px}
.hero .big.md{font-size:36px}
.hero .link{color:var(--accent);font-weight:600;font-size:15px}
.split{display:flex;border-top:1px solid var(--line);padding-top:14px;gap:12px}
.split>div{flex:1} .split .k{color:var(--muted);font-size:14px} .split .v{font-size:21px;font-weight:600;margin-top:2px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec a,.sec button.lnk{color:var(--accent);font-weight:600;font-size:14px}
.stack>*+*{margin-top:12px}
.dashed{display:flex;align-items:center;justify-content:space-between;width:100%;padding:18px;border:1.5px dashed var(--line);border-radius:22px;color:var(--text);font-weight:600;justify-content:center;gap:8px}
.dashed.l{justify-content:space-between;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.6}

/* menu grid */
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.menu button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:500}
.menu .ico{width:58px;height:58px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.menu button:active .ico{background:var(--card2)}

/* baris daftar */
.list>.row+.row{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left}
.row.tap:active{background:var(--card2)}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.row .r{text-align:right;font-weight:600;white-space:nowrap}
.circ{width:44px;height:44px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.sq{width:44px;height:44px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
.wbadge{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em}
.datebadge{width:46px;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-weight:700;line-height:1;background:var(--card2)}
.datebadge b{font-size:21px;font-weight:700} .datebadge i{font-style:normal;font-size:11px;font-weight:600;margin-top:2px;opacity:.9}
.datebadge.danger{background:var(--neg);color:#2a0d08} .datebadge.info{background:var(--accent);color:var(--accent-ink)} .datebadge.warn{background:var(--warn);color:#2b1c03}
.datebadge.ok{background:var(--card2);color:var(--muted)}
.chip-amt{font-size:12.5px;background:var(--card2);padding:4px 10px;border-radius:99px;font-weight:600;display:inline-block;margin-top:4px;color:var(--muted)}
.btn{height:44px;padding:0 20px;border-radius:14px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.sec2{background:var(--card2);color:var(--text)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--accent)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);height:54px;border-radius:18px;font-size:17px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* progress */
.bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden;position:relative}
.hero .bar,.hero.bar{background:rgba(255,255,255,.1)}
:root[data-theme=light] .hero .bar{background:rgba(0,0,0,.08)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--text);transition:width .4s}
.bar.over>i{background:var(--text)}
.segs{display:flex;gap:8px}.segs>i{flex:1;height:9px;border-radius:99px;background:var(--card2)}.segs>i.on{background:var(--text)}
.hero .segs>i{background:rgba(255,255,255,.12)}.hero .segs>i.on{background:var(--text)}
.stackbar{display:flex;gap:3px;height:12px;margin:2px 0 14px}.stackbar>i{border-radius:99px;display:block;min-width:6px}
.leg{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:16px}
.leg .dot{width:9px;height:9px;border-radius:50%;flex:none}.leg .grow{flex:1;color:var(--muted)}.leg b{font-weight:600}

/* filter */
.search{display:flex;align-items:center;gap:10px;height:52px;border:1px solid var(--line);border-radius:18px;padding:0 16px;background:var(--card);color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:16px;min-width:0}
.filters{display:flex;gap:10px;margin:12px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fsel{position:relative;flex:none;height:42px;border-radius:99px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;padding:0 14px 0 16px;font-weight:500}
.fsel.on{border-color:var(--accent);color:var(--accent)}
.fsel select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:var(--card)}
.tile .k{color:var(--muted);font-size:14px}.tile .v{font-weight:700;font-size:19px;margin-top:2px}
.dayh{display:flex;justify-content:space-between;color:var(--muted);margin:22px 2px 10px;font-size:15px}

/* chip/segmen */
.seg{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:14px}
.seg button{flex:1;height:36px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:18px;min-height:52px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:var(--muted);text-align:center}
.opt.c{flex-direction:column;min-height:82px;gap:8px;font-weight:500}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.opt.dash{border-style:dashed;background:transparent}
.opt .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
.sw.on{border-color:var(--bg);outline:2px solid var(--text)}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted);background:var(--card)}
.pills button.on{border-color:var(--accent);color:var(--accent)}

/* nav bawah */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(448px,calc(100% - 32px));height:76px;border-radius:30px;background:var(--nav);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;padding:0 8px;z-index:40;box-shadow:var(--shadow)}
.nav .it{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500}
.nav .it .pl{width:56px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center}
.nav .it.on{color:var(--text);font-weight:700}.nav .it.on .pl{background:var(--accent-soft);color:var(--accent)}
.fab{width:62px;height:62px;border-radius:21px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto;transform:translateY(-4px);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .25s,background .2s}
.fab svg{width:30px;height:30px;stroke-width:2.2;transition:transform .25s}
.fab.open{background:var(--btn);color:var(--btn-ink)} .fab.open svg{transform:rotate(45deg)}

/* speed dial */
.dial{position:fixed;inset:0;z-index:30;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s}
.dial.open{opacity:1;pointer-events:auto}
.dial .list2{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));width:min(448px,100%);padding:0 16px;display:flex;flex-direction:column;gap:12px}
.dial .it{display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(14px);transition:all .22s}
.dial.open .it{opacity:1;transform:none}
.dial .it .sq{width:52px;height:52px;border-radius:17px;background:var(--card2);border:1px solid var(--line)}
.dial .it .lab{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:9px 16px;text-align:left}
.dial .it .lab b{display:block;font-size:17px}.dial .it .lab span{color:var(--muted);font-size:14px}

/* sheet */
#layer .layer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#layer .back{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s;margin:0;width:auto;height:auto;border-radius:0;display:block}
#layer .layer.in .back{opacity:1}
#layer .sheet{position:relative;width:min(480px,100%);max-height:94vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(24px);opacity:0;transition:all .22s}
#layer .layer.in .sheet{transform:none;opacity:1}
#layer .layer.full .sheet{height:100%;max-height:100%;border-radius:0;border:0;padding-top:0;display:flex;flex-direction:column}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.full .grab{display:none}
.sh-head{display:flex;align-items:center;gap:8px;min-height:60px;margin:0 -8px}
.sh-head h3{margin:0;font-size:24px;font-weight:700;flex:1;letter-spacing:-.02em}
.sh-body{flex:1;overflow:auto;margin:0 -16px;padding:0 16px 16px}
.sh-foot{padding-top:12px;border-top:1px solid var(--line);margin:0 -16px;padding-left:16px;padding-right:16px}
.pop{position:absolute;left:0;right:0;top:0}
.popcard{position:absolute;left:50%;transform:translateX(-50%);top:76px;width:min(448px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.popcard .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{height:48px;border-radius:14px;background:var(--card2);font-weight:500;position:relative}
.mgrid button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mgrid button.now::after{content:"";position:absolute;top:7px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mgrid button.on.now::after{background:var(--accent-ink)}
.dlg{position:relative;width:min(380px,calc(100% - 40px));background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin:auto;box-shadow:var(--shadow)}
.layer.mid{align-items:center}
.dlg h4{margin:0 0 6px;font-size:19px}.dlg p{margin:0 0 18px;color:var(--muted)}
.dlg .acts{display:flex;gap:10px}.dlg .acts .btn{flex:1}

/* form */
.fld{margin:0 0 14px}
.fld>label{display:block;font-size:13.5px;color:var(--muted);margin:0 2px 6px;font-weight:500}
.inp{display:flex;align-items:center;gap:8px;height:52px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:0 14px}
.inp:focus-within{border-color:var(--accent)}
.inp>span{color:var(--muted);font-weight:600}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;font-weight:600;height:100%;color:var(--text)}
.inp select option{background:var(--card);color:var(--text)}
.inp input[type=date],.inp input[type=month]{font-weight:600}
.hint{font-size:13px;color:var(--muted);margin:-6px 2px 14px}
.hint.bad{color:var(--neg)}
.amt{text-align:center;margin:14px 0 6px}
.amt .k{color:var(--muted);font-size:15px;margin-bottom:6px}
.amt .box{display:inline-flex;align-items:baseline;gap:10px;border-bottom:2.5px solid var(--accent);padding:0 8px 4px;max-width:100%}
.amt .cur{font-size:26px;color:var(--muted);font-weight:600}
.amt input{width:9ch;min-width:3ch;font-size:54px;font-weight:700;letter-spacing:-.03em;background:none;border:0;outline:0;text-align:left;color:var(--text);padding:0;font-variant-numeric:tabular-nums}
.amt input.neg{color:var(--neg)} .amt input.pos{color:var(--pos)}
.amt .box.sm input{font-size:38px}
.infocard{border:1px solid var(--line);background:var(--card);border-radius:22px;margin-top:6px}
.irow{display:flex;gap:14px;align-items:center;padding:12px 16px;position:relative}
.irow+.irow{border-top:1px solid var(--line)}
.irow>svg{color:var(--muted)}
.irow .c{flex:1;min-width:0}.irow .c small{display:block;color:var(--muted);font-size:13.5px}
.irow .c input,.irow .c select{width:100%;background:none;border:0;outline:0;font-weight:600;font-size:17px;padding:0;height:26px;color:var(--text)}
.irow .c select option{background:var(--card);color:var(--text)}
.irow .bal{color:var(--muted);font-size:15px}
.quick{display:flex;gap:8px;margin:8px 0 0 54px}
.sectitle{font-weight:700;margin:20px 2px 10px;font-size:16px}
.note{padding:12px 14px;border-radius:14px;background:var(--card2);color:var(--muted);font-size:14px;margin:8px 0}

/* chart */
.chart{position:relative;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart text.b{fill:var(--text);font-weight:700}
.chart .g{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:2;box-shadow:var(--shadow)}
.tip.on{opacity:1}
.tip b{display:block;font-size:13px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.catrow{margin:14px 0}
.catrow .h{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px;gap:8px}
.catrow .h span:last-child{font-weight:500;color:var(--muted);white-space:nowrap}
.catrow .d{font-size:12.5px;color:var(--muted);margin-top:5px}
.sparkline{display:block;width:100%;height:84px;margin:6px 0 14px}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(112px + env(safe-area-inset-bottom));background:var(--btn);color:var(--btn-ink);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14.5px;z-index:90;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 40px);text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)} .toast.bad{background:var(--neg);color:#2a0d08}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:bz 1s infinite linear;opacity:0;transition:opacity .2s}
.busy.on{opacity:1}
@keyframes bz{from{background-position:-50% 0}to{background-position:150% 0}}
.skel{height:120px;border-radius:24px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-top:14px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.err{padding:60px 20px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted)}
.tag.neg{background:var(--neg-soft);color:var(--neg)} .tag.pos{background:var(--pos-soft);color:var(--pos)}
@media (min-width:520px){ body{background:radial-gradient(1200px 500px at 50% -10%,var(--accent-soft),transparent),var(--bg)} }

/* ---- login PIN ---- */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.lk{width:100%;max-width:340px;text-align:center}
.lk-logo{width:44px;margin:0 auto 18px;color:var(--accent)}.lk-logo svg{width:44px;height:auto}
.lk h2{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
.lk-dots{display:flex;gap:14px;justify-content:center;margin:22px 0 8px;height:16px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);transition:.12s}
.lk-dots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.lk-dots.shake{animation:lkshake .35s}@keyframes lkshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lk-err{min-height:20px;color:var(--neg,#ff8f80);font-size:13.5px;margin-bottom:14px}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lk-pad button{height:64px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:24px;font-weight:600}
.lk-pad button:active{background:var(--card2)}.lk-pad button:disabled{opacity:.45}
.lk-pad .go{background:var(--accent);color:#06222a;border-color:transparent}
.lk-steps{text-align:left;color:var(--text);line-height:1.7;margin:14px 0 22px;padding-left:20px;font-size:14px}
.fld{margin-bottom:12px}.fld label{display:block;margin:0 2px 6px}
</style>

/* ---------- ikon ---------- */

function initials(name) {
  const w = String(name).replace(/[^A-Za-z0-9 ]/g, '').trim();

  const first = w.split(/\s+/)[0];
  return (first.length <= 3 ? first : first.slice(0, 2)).toUpperCase();
}

  if (w.type === 'credit') return '<span class="wbadge" style="background:' + esc(w.color) + '">' + ic('card') + '</span>';

const walletById = id => S.st.wallets.find(w => w.id === id);
const activeWallets = () => S.st.wallets.filter(w => !w.archived);

  const d = S.st.settings.default_wallet_id, a = activeWallets();

/* ---------- API ---------- */
let busyN = 0;
function busy(d) { busyN += d; $('#busy').classList.toggle('on', busyN > 0); }
const HOSTED = !(window.google && window.google.script && window.google.script.run);
function apiUrl() { try { return localStorage.getItem('api_url') || ''; } catch (e) { return ''; } }
function transport(action, payload, month, token) {
  const g = window.google && window.google.script && window.google.script.run;
  if (g) return new Promise((ok, no) => g.withSuccessHandler(ok).withFailureHandler(e => no(new Error((e && e.message) || 'Gagal menghubungi server.'))).api(action, payload, month, token));
  const url = apiUrl();
  if (!url) return Promise.reject(new Error('URL server belum diatur.'));
  // text/plain = "simple request", tanpa preflight CORS (Apps Script tidak menjawab OPTIONS)
  return fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: 1, action: action, payload: payload, month: month, token: token }) })
    .then(r => r.json(), () => { throw new Error('Tidak bisa menghubungi server. Periksa koneksi dan URL Web App.'); })
    .catch(e => { throw new Error(e && e.message && !/JSON|Unexpected/.test(e.message) ? e.message : 'Server tidak membalas dengan benar. Pastikan URL Web App benar dan akses deploy "Siapa saja".'); });
}
function raw(action, payload, month) {
  busy(1);
  return transport(action, payload || {}, month === undefined ? S.month : month, S.token || null).then(r => {
    busy(-1);
    if (r && !r.ok && (r.code === 'AUTH' || r.code === 'NO_PIN')) { showLock(r.code, r.error); throw new Error(r.error); }
    return r;
  }, e => { busy(-1); throw e; });
}
/** Aksi tulis: jalankan, ganti state dengan hasil terbaru, render ulang. */
async function act(action, payload, msg) {
  const r = await raw(action, payload);
  if (!r || !r.ok) throw new Error((r && r.error) || 'Gagal.');
  if (r.state) { S.st = r.state; S.month = r.state.month; }
  render();
  if (r.warnings && r.warnings.length) toast(r.warnings.join(' '), true); else if (msg) toast(msg);
  return r.result;
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(e.message || String(e), true); } }
let toastT;
function toast(m, bad) {
  const el = $('#toast'); el.textContent = m; el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), bad ? 4500 : 2400);
}

/* ---------- layer / sheet / dialog ---------- */
function layerOpen(inner, cls) {
  const el = document.createElement('div');
  el.className = 'layer ' + (cls || '');
  el.innerHTML = '<div class="back" data-x="1"></div>' + inner;
  $('#layer').appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  return el;
}
function layerClose(el) { if (!el || el._c) return; el._c = 1; el.classList.remove('in'); setTimeout(() => el.remove(), 230); }
function closeAllLayers() { $$('#layer .layer').forEach(layerClose); }
function sheet(title, body, foot, cls) {
  return layerOpen('<div class="sheet"><div class="grab"></div>' +
    (title ? '<div class="sh-head"><h3>' + esc(title) + '</h3><button class="iconbtn" data-x="1" aria-label="Tutup">' + ic('x') + '</button></div>' : '') +
    '<div class="sh-body">' + body + '</div>' + (foot ? '<div class="sh-foot">' + foot + '</div>' : '') + '</div>', cls);
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise(res => {
    const el = layerOpen('<div class="dlg" role="alertdialog"><h4>' + esc(title) + '</h4><p>' + esc(text) + '</p><div class="acts"><button class="btn sec2" data-c="0">Batal</button><button class="btn ' + (danger === false ? '' : 'danger') + '" data-c="1">' + esc(okLabel || 'Ya') + '</button></div></div>', 'mid');
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-c]');
      if (b) { layerClose(el); res(b.dataset.c === '1'); } else if (e.target.closest('[data-x]')) res(false);
    });
  });
}
/** items: [{label, sub, icon, danger, fn}] */
function actionSheet(title, subHtml, items) {
  const body = (subHtml ? '<div class="muted" style="margin:-6px 2px 14px">' + subHtml + '</div>' : '') +

/* ---------- form engine ---------- */
function fieldHtml(f, v) {
  const k = f.k, val = v[k];
  if (f.t === 'hint') return '<div class="hint ' + (f.bad ? 'bad' : '') + '"' + (f.id ? ' id="' + f.id + '"' : '') + ' style="margin:0 2px 14px">' + (typeof f.html === 'function' ? f.html(v) : f.html) + '</div>';
  if (f.t === 'html') return f.html;
  if (f.t === 'btn') return '<button type="button" class="dashed" data-fx="' + esc(f.id) + '">' + (f.icon ? ic(f.icon, 's') : '') + esc(f.label) + '</button>';
  const lab = f.label ? '<label>' + esc(f.label) + (f.req ? ' *' : '') + '</label>' : '';
  let inner = '';
  const ph = esc(f.ph || '');
  switch (f.t) {
    case 'money':
      inner = '<div class="inp"><span>Rp</span><input data-fk="' + k + '" data-ft="money" inputmode="numeric" autocomplete="off" placeholder="' + (ph || '0') + '" value="' + (val ? group(val) : '') + '"></div>'; break;
    case 'num':
      inner = '<div class="inp"><input data-fk="' + k + '" data-ft="num" inputmode="decimal" autocomplete="off" placeholder="' + ph + '" value="' + esc(val === 0 && !f.zero ? '' : val) + '">' + (f.unit ? '<span>' + esc(f.unit) + '</span>' : '') + '</div>'; break;
    case 'date': inner = '<div class="inp"><input type="date" data-fk="' + k + '" data-ft="date" value="' + esc(val) + '"></div>'; break;
    case 'month': inner = '<div class="inp"><input type="month" data-fk="' + k + '" data-ft="month" value="' + esc(val) + '"></div>'; break;
    case 'select':
      inner = '<div class="inp"><select data-fk="' + k + '" data-ft="select">' + f.opts.map(o => '<option value="' + esc(o.v) + '"' + (o.v === val ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select></div>'; break;
    case 'area': inner = '<div class="inp" style="height:auto;padding:10px 14px"><textarea data-fk="' + k + '" data-ft="text" rows="2" placeholder="' + ph + '" style="height:auto;resize:none">' + esc(val) + '</textarea></div>'; break;
    case 'pills':
      inner = '<div class="pills">' + f.opts.map(o => '<button type="button" data-fp="' + k + '" data-v="' + esc(o.v) + '" class="' + (val === o.v ? 'on' : '') + '">' + esc(o.l) + '</button>').join('') + '</div>'; break;
    case 'swatch':
      inner = '<div class="swrow">' + f.opts.map(c => '<button type="button" class="sw ' + (val === c ? 'on' : '') + '" data-fp="' + k + '" data-v="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>').join('') + '</div>'; break;
    case 'icons':
      inner = '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">' + f.opts.map(n => '<button type="button" class="opt ' + (val === n ? 'on' : '') + '" style="min-height:48px;padding:0" data-fp="' + k + '" data-v="' + n + '">' + ic(n) + '</button>').join('') + '</div>'; break;
    case 'switch':
      return '<div class="fld"><label class="inp" style="justify-content:space-between"><span style="color:var(--text);font-weight:600">' + esc(f.label) + '</span><input type="checkbox" data-fk="' + k + '" data-ft="switch" style="flex:none;width:22px;height:22px;accent-color:var(--accent)"' + (val ? ' checked' : '') + '></label>' +
        (f.hint ? '<div class="hint" style="margin:6px 2px 0">' + f.hint + '</div>' : '') + '</div>';
    default:
      inner = '<div class="inp"><input data-fk="' + k + '" data-ft="text" maxlength="' + (f.max || 80) + '" autocomplete="off" placeholder="' + ph + '" value="' + esc(val) + '"></div>';
  }
  return '<div class="fld">' + lab + inner + (f.hint ? '<div class="hint" style="margin:6px 2px 0">' + f.hint + '</div>' : '') + '</div>';
}

/**
 * form({title, fields, submit, onSubmit(vals), danger:{label, fn}})
 * Field: {k, t, label, v, req, show(vals), opts, hint, ph}
 */
function form(o) {
  const vals = {};
  o.fields.forEach(f => { if (f.k) vals[f.k] = f.v === undefined ? '' : f.v; });
  const visible = () => o.fields.filter(f => !f.show || f.show(vals));
  const bodyHtml = () => '<div class="fb">' + visible().map(f => fieldHtml(f, vals)).join('') + '</div>';
  const foot = '<button class="btn primary block" data-fs="1">' + esc(o.submit || 'Simpan') + '</button>' +
    (o.danger ? '<button class="btn danger block" style="margin-top:10px" data-fd="1">' + esc(o.danger.label) + '</button>' : '');
  const el = sheet(o.title, bodyHtml(), foot);
  const fb = $('.fb', el);
  const dynamic = o.fields.some(f => f.show);
  const rebuild = () => { const sc = $('.sh-body', el).scrollTop; fb.innerHTML = visible().map(f => fieldHtml(f, vals)).join(''); $('.sh-body', el).scrollTop = sc; };
  const read = t => {
    const k = t.dataset.fk, ty = t.dataset.ft;
    if (ty === 'money') { const n = parseMoney(t.value); t.value = n ? group(n) : ''; vals[k] = n; }
    else if (ty === 'switch') vals[k] = t.checked;
    else if (ty === 'num') vals[k] = t.value.replace(',', '.');
    else vals[k] = t.value;
  };
  el.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.fk) read(e.target); });
  el.addEventListener('change', e => {
    const t = e.target; if (!t.dataset || !t.dataset.fk) return;
    read(t);
    if ((t.dataset.ft === 'select' || t.dataset.ft === 'switch') && (dynamic || o.onChange)) { if (o.onChange) o.onChange(vals, { rebuild }); rebuild(); }
  });
  async function submit() {
    const missing = visible().find(f => f.req && (vals[f.k] === '' || vals[f.k] == null || ((f.t === 'money' || f.t === 'num') && !(+vals[f.k]))));
    if (missing) { toast((missing.label || 'Isian') + ' wajib diisi.', true); return; }
    const btn = $('[data-fs]', el); btn.disabled = true;
    try { await o.onSubmit(vals); layerClose(el); }
    catch (e) { toast(e.message || String(e), true); }
    finally { btn.disabled = false; }
  }
  el.addEventListener('click', e => {
    const p = e.target.closest('[data-fp]');
    if (p) { vals[p.dataset.fp] = p.dataset.v; if (o.onChange) o.onChange(vals, { rebuild }); rebuild(); return; }
    if (e.target.closest('[data-fs]')) { submit(); return; }
    const d = e.target.closest('[data-fd]');
    if (d) { layerClose(el); setTimeout(() => guard(o.danger.fn), 150); return; }
    const x = e.target.closest('[data-fx]');
    if (x) { const f = o.fields.find(ff => ff.id === x.dataset.fx); if (f && f.fn) f.fn(vals, { el, rebuild }); }
  });
  return { el, vals, rebuild };
}

/* ---------- grafik SVG ---------- */
const CH = {}; let chN = 0;
function registerChart(c) { const id = 'ch' + (++chN); CH[id] = c; return id; }
function niceTicks(min, max, n) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 1e6) / 1e6);
  return t;
}
const chartWrap = (id, svg) => '<div class="chart" data-ch="' + id + '">' + svg + '<div class="tip"></div></div>';
function tipHtml(title, lines) { return '<b>' + esc(title) + '</b>' + lines.join('<br>'); }

/** data: [{label, value, tip}] */
function lineChart(data) {
  const W = 340, H = 176, pl = 22, pr = 48, pt = 16, pb = 32;
  const vals = data.map(d => d.value), ticks = niceTicks(Math.min.apply(null, vals), Math.max.apply(null, vals), 2);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => pl + (W - pl - pr) * (data.length === 1 ? 0.5 : i / (data.length - 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  let g = '';
  ticks.forEach((t, i) => {
    g += '<line class="g" x1="' + pl + '" x2="' + (W - pr + 12) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>';
    if (i > 0) g += '<text x="' + W + '" y="' + (Y(t) - 5) + '" text-anchor="end">' + (S.hide ? '•••' : compact(t)) + '</text>';
  });
  const pts = data.map((d, i) => X(i) + ',' + Y(d.value)).join(' ');
  const last = data.length - 1;
  let lbl = '';
  data.forEach((d, i) => { lbl += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" class="' + (i === last ? 'b' : '') + '">' + esc(d.label) + '</text>'; });
  const id = registerChart({ w: W, h: H, maxd: 28, pts: data.map((d, i) => ({ x: X(i), y: Y(d.value), html: d.tip })) });
  return chartWrap(id, '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik kekayaan bersih">' + g +
    '<polyline points="' + pts + '" fill="none" style="stroke:var(--text)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(last) + '" cy="' + Y(data[last].value) + '" r="9" style="fill:var(--accent);opacity:.18"/>' +
    '<circle cx="' + X(last) + '" cy="' + Y(data[last].value) + '" r="5.5" style="fill:var(--accent)"/>' + lbl + '</svg>');
}

/** flow: [{month, income, expense}] */
function flowChart(flow) {
  const W = 340, H = 170, pl = 4, pr = 4, pt = 10, pb = 28, n = flow.length;
  const max = Math.max.apply(null, flow.map(f => Math.max(f.income, f.expense)).concat([1])) * 1.08;
  const gw = (W - pl - pr) / n, bw = Math.min(18, gw * 0.3), Y = v => pt + (H - pt - pb) * (1 - v / max), base = Y(0);
  let s = '<line class="g" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>', pts = [];
  flow.forEach((f, i) => {
    const cx = pl + gw * (i + 0.5);
    [[f.income, cx - bw - 1.5, '--pos'], [f.expense, cx + 1.5, '--neg']].forEach(b => {
      const h = Math.max(b[0] ? 2 : 0, base - Y(b[0]));
      s += '<rect x="' + b[1] + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="4" style="fill:var(' + b[2] + ')"/>';
    });
    s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" class="' + (i === n - 1 ? 'b' : '') + '">' + mAbbr(f.month) + '</text>';
    pts.push({ x: cx, y: Y(Math.max(f.income, f.expense)), html: tipHtml(mShort(f.month), ['Masuk ' + rp(f.income), 'Keluar ' + rp(f.expense)]) });
  });
  const id = registerChart({ w: W, h: H, maxd: gw / 2, pts: pts });
  return chartWrap(id, '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Arus kas">' + s + '</svg>');
}

/** daily: [{day, amount}] */
function dailyChart(daily, avg, today) {
  const W = 340, H = 120, pt = 8, pb = 22, n = daily.length, max = Math.max.apply(null, daily.map(d => d.amount).concat([1])) * 1.1;
  const gw = W / n, bw = gw * 0.62, Y = v => pt + (H - pt - pb) * (1 - v / max), base = Y(0);
  let s = '<line class="g" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>', pts = [];
  daily.forEach((d, i) => {
    const x = gw * i + (gw - bw) / 2, h = d.amount ? Math.max(2, base - Y(d.amount)) : 0;
    s += '<rect x="' + x + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="2" style="fill:' + (d.day === today ? 'var(--accent)' : 'var(--bar2)') + '"/>';
    if (d.day === 1 || d.day % 7 === 0) s += '<text x="' + (gw * i + gw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + d.day + '</text>';
    pts.push({ x: gw * i + gw / 2, y: Y(d.amount), html: tipHtml('Tgl ' + d.day, [rp(d.amount)]) });
  });
  if (avg > 0 && avg < max) s += '<line x1="0" x2="' + W + '" y1="' + Y(avg) + '" y2="' + Y(avg) + '" style="stroke:var(--accent)" stroke-width="1.2" stroke-dasharray="4 4"/>';
  const id = registerChart({ w: W, h: H, maxd: gw, pts: pts });
  return chartWrap(id, '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Pengeluaran harian">' + s + '</svg>');
}

/** history: [{date, value}] */
function sparkline(hist) {
  if (!hist || hist.length < 2) return '';
  const W = 340, H = 84, v = hist.map(h => h.value), lo = Math.min.apply(null, v), hi = Math.max.apply(null, v), rg = hi - lo || 1;
  const X = i => i / (hist.length - 1) * W, Y = x => 8 + (H - 16) * (1 - (x - lo) / rg);
  const line = hist.map((h, i) => X(i) + ',' + Y(h.value)).join(' ');
  const up = v[v.length - 1] >= v[0], col = up ? 'var(--pos)' : 'var(--neg)';
  return '<svg class="sparkline" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Riwayat nilai"><polygon points="0,' + H + ' ' + line + ' ' + W + ',' + H + '" style="fill:' + col + ';opacity:.14"/>' +
    '<polyline points="' + line + '" fill="none" style="stroke:' + col + '" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}

function chartPointer(e) {
  const box = e.target.closest ? e.target.closest('.chart[data-ch]') : null;
  $$('.chart .tip.on').forEach(t => { if (!box || t.parentNode !== box) t.classList.remove('on'); });
  if (!box) return;
  const c = CH[box.dataset.ch], svg = $('svg', box), tip = $('.tip', box); if (!c || !svg) return;
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * c.w;
  let best = null, bd = 1e9;
  c.pts.forEach(p => { const d = Math.abs(p.x - x); if (d < bd) { bd = d; best = p; } });
  if (!best || bd > c.maxd) { tip.classList.remove('on'); return; }
  tip.innerHTML = best.html; tip.style.left = (best.x / c.w * 100) + '%'; tip.style.top = (best.y / c.h * 100) + '%'; tip.classList.add('on');
}

/* ===================== TRANSAKSI ===================== */
function filteredTx() {
  const f = S.f, q = f.q.trim().toLowerCase(), types = f.g && TYPE_GROUPS[f.g];
  return S.st.transactions.filter(t => {
    if (types && types.indexOf(t.type) < 0) return false;
    if (f.c && t.category_id !== f.c) return false;
    if (f.w && t.wallet_id !== f.w && t.to_wallet_id !== f.w) return false;
    if (q) {
      const hay = (t.note + ' ' + t.category_name + ' ' + t.wallet_name + ' ' + t.to_wallet_name + ' ' + TYPE_LABEL[t.type]).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}
function txBodyHtml() {
  const list = filteredTx();
  let inc = 0, out = 0;
  list.forEach(t => { if (t.type === 'income') inc += t.amount; out += txOut(t); });
  const days = [], by = {};
  list.forEach(t => { if (!by[t.date]) { by[t.date] = { date: t.date, items: [], out: 0, inc: 0 }; days.push(by[t.date]); } by[t.date].items.push(t); by[t.date].out += txOut(t); if (t.type === 'income') by[t.date].inc += t.amount; });
  const filtered = S.f.q || S.f.g || S.f.c || S.f.w;
  return '<div class="tiles"><div class="tile"><div class="k">Masuk</div><div class="v pos num">' + signed(false, inc) + '</div></div><div class="tile"><div class="k">Keluar</div><div class="v neg num">' + signed(true, out) + '</div></div></div>' +
    (days.length ? days.map(d => '<div class="dayh"><span>' + relDay(d.date) + '</span><span class="num">' + (d.out ? signed(true, d.out) : (d.inc ? signed(false, d.inc) : '')) + '</span></div><div class="card flush list">' + d.items.map(txRow).join('') + '</div>').join('')
      : '<div style="margin-top:18px">' + empty('search', filtered ? 'Tidak ada transaksi yang cocok dengan filter.' : 'Belum ada transaksi di ' + mLong(S.st.month) + '.') + '</div>') +
    (filtered ? '<div style="text-align:center;margin-top:16px"><button class="btn sec2 sm" data-a="clearfilter">Hapus filter</button></div>' : '');
}

  const fixCats = () => {
    const kind = T.type === 'income' ? 'income' : 'expense';
    if ((T.type === 'expense' || T.type === 'income') && !catsOf(kind).some(c => c.id === T.category_id)) T.category_id = (catsOf(kind)[0] || {}).id || '';
  };
  const fixTo = () => { if (!T.to_wallet_id || T.to_wallet_id === T.wallet_id) T.to_wallet_id = (activeWallets().find(w => w.id !== T.wallet_id && w.type !== 'credit') || activeWallets().find(w => w.id !== T.wallet_id) || {}).id || ''; };
  fixCats();
  const el = layerOpen('<div class="sheet"><div class="sh-head"><button class="iconbtn" data-x="1" aria-label="Tutup">' + ic('x') + '</button><h3>Catat transaksi</h3></div><div class="sh-body"></div><div class="sh-foot"><button class="btn primary block" data-save="1"></button></div></div>', 'full');
  const bodyEl = $('.sh-body', el), saveBtn = $('[data-save]', el);

  const unpaid = () => S.st.bills.items.filter(b => b.status !== 'paid');
  const openDebts = () => S.st.debts.items.filter(d => !d.settled);
  const selDebt = () => S.st.debts.items.find(d => d.id === T.debt_id);
  const walletLabel = () => {
    if (T.type === 'income') return 'Ke wallet';
    if (T.type === 'goal') return T.dir === 'in' ? 'Dari wallet' : 'Ke wallet';
    if (T.type === 'invest') return T.dir === 'in' ? 'Dari wallet' : 'Ke wallet';
    if (T.type === 'debt') { const d = selDebt(); return d && d.kind === 'lend' ? 'Ke wallet' : 'Dari wallet'; }
    if (T.type === 'transfer') return 'Dari wallet';
    return 'Wallet';
  };
  const isOut = () => (T.type === 'expense' || T.type === 'transfer' || T.type === 'bill' || (T.type === 'goal' && T.dir === 'in') ||
    (T.type === 'invest' && T.dir === 'in') || (T.type === 'debt' && (selDebt() || {}).kind === 'borrow'));
  const saveLabel = () => ({
    expense: 'Simpan pengeluaran', income: 'Simpan pemasukan', transfer: 'Simpan transfer', bill: 'Bayar cicilan / tagihan',
    goal: T.dir === 'in' ? 'Setor ke target' : 'Tarik dari target', invest: T.dir === 'in' ? 'Setor investasi' : 'Jual investasi',
    debt: selDebt() && selDebt().kind === 'lend' ? 'Terima pembayaran' : 'Bayar hutang'
  }[T.type]);
  const irow = (icon, label, inner, right, over) => '<div class="irow">' + ic(icon) + '<div class="c"><small>' + label + '</small>' + inner + '</div>' + (right || '') + (over || '') + '</div>';
  // kartu kredit hanya boleh: sumber pengeluaran / tagihan, dan tujuan transfer (bayar tagihan)
  const cardOk = key => (key === 'wallet_id' && (T.type === 'expense' || T.type === 'bill')) || (key === 'to_wallet_id' && T.type === 'transfer');
  const pickable = key => activeWallets().filter(w => w.type !== 'credit' || cardOk(key));
  const fixWallet = () => { if (!T.wallet_id || (walletById(T.wallet_id) || {}).type === 'credit' && !cardOk('wallet_id')) T.wallet_id = (pickable('wallet_id')[0] || {}).id || ''; };
  const walletRow = (label, key) => {
    const w = walletById(T[key]) || {};
    return irow('wallet', label, '<b style="font-size:17px;display:block;line-height:26px">' + esc(w.name || 'Pilih wallet') + '</b>', '<span class="bal num">' + (w.id ? rp(w.balance) : '') + '</span>',
      '<select data-sel="' + key + '" aria-label="' + label + '" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px">' +
      pickable(key).concat(walletById(T[key]) && walletById(T[key]).archived ? [walletById(T[key])] : []).map(x => '<option value="' + x.id + '"' + (x.id === T[key] ? ' selected' : '') + '>' + esc(x.name) + (x.type === 'credit' ? ' (kartu) · utang ' + rp(Math.max(0, -x.balance)) : ' · ' + rp(x.balance)) + '</option>').join('') + '</select>');
  };
  const dateRow = () => irow('cal', 'Tanggal', '<b style="font-size:17px;display:block;line-height:26px">' + relDate(T.date) + (T.date.slice(0, 4) !== st.today.slice(0, 4) ? ' ' + T.date.slice(0, 4) : '') + '</b>', '',
    '<input type="date" data-in="date" value="' + T.date + '" aria-label="Tanggal" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer">');
  const noteRow = () => irow('doc', 'Catatan', '<input data-in="note" maxlength="120" placeholder="Opsional" value="' + esc(T.note) + '" autocomplete="off">');
  const choice = (items, key, mk) => '<div class="card flush list">' + items.map(x => {
    const m = mk(x);
    return '<button class="row tap" data-pick="' + key + '" data-v="' + x.id + '"><span class="tx"><div class="t">' + esc(m.t) + '</div><div class="s">' + esc(m.s) + '</div></span>' + (T[key] === x.id ? '<span style="color:var(--accent)">' + ic('check') + '</span>' : '') + '</button>';
  }).join('') + '</div>';
  const seg = (a, b) => '<div class="seg" style="margin-top:14px"><button data-dir="in" class="' + (T.dir === 'in' ? 'on' : '') + '">' + a + '</button><button data-dir="out" class="' + (T.dir === 'out' ? 'on' : '') + '">' + b + '</button></div>';

  function draw() {
    const sc = bodyEl.scrollTop, ty = T.type;
    const chips = [['expense', 'Keluar', 'minus'], ['income', 'Masuk', 'plus'], ['transfer', 'Transfer', 'swap'], ['invest', 'Invest', 'trend'], ['goal', 'Target', 'target'], ['debt', 'Hutang', 'doc'], ['bill', 'Cicilan', 'repeat']];
    let h = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' + chips.map(c => '<button class="opt c ' + (ty === c[0] ? 'on' : '') + '" style="min-height:62px;gap:5px;font-size:14px" data-t="' + c[0] + '">' + ic(c[2], 's') + '<span>' + c[1] + '</span></button>').join('') + '</div>';
    h += '<div class="amt"><div class="k">Nominal</div><div class="box"><span class="cur">Rp</span><input id="amt" inputmode="numeric" autocomplete="off" aria-label="Nominal" placeholder="0" class="' + (ty === 'expense' ? 'neg' : (ty === 'income' ? 'pos' : '')) + '"></div></div>';
    h += '<div class="pills" style="justify-content:center;margin:12px 0 2px">' + [10000, 50000, 100000].map(n => '<button data-q="' + n + '">+' + compact(n) + '</button>').join('') + '<button data-q="0">Hapus</button></div><div class="hint bad" id="hint" style="text-align:center;margin:8px 0 0;min-height:18px"></div>';
    if (ty === 'expense' || ty === 'income') {
      h += '<div class="sectitle">Kategori</div><div class="grid3">' + catsOf(ty).map(c => '<button class="opt c ' + (c.id === T.category_id ? 'on' : '') + '" data-cat="' + c.id + '">' + ic(c.icon) + '<span class="nm">' + esc(c.name) + '</span></button>').join('') +
        '<button class="opt c dash" data-newcat="' + ty + '">' + ic('plus') + '<span>Baru</span></button></div><div style="height:14px"></div>';
    }
    if (ty === 'goal') {
      const gs = st.goals.items.filter(g => !g.archived);
      h += '<div class="sectitle">Target</div>' + (gs.length ? choice(gs, 'goal_id', g => ({ t: g.name, s: rpf(g.saved) + ' dari ' + rpf(g.target) + ' · ' + g.pct + '%' })) : '<div class="note">Belum ada target.</div>') +
        '<div style="margin-top:10px"><button class="dashed" data-extra="goal">' + ic('plus', 's') + 'Target baru</button></div>' + seg('Setor ke target', 'Tarik dari target') + '<div style="height:6px"></div>';
    }
    if (ty === 'debt') {
      const ds = openDebts();
      h += '<div class="sectitle">Hutang / piutang</div>' + (ds.length ? choice(ds, 'debt_id', d => ({ t: (d.kind === 'borrow' ? 'Bayar hutang ke ' : 'Terima dari ') + d.person, s: 'Sisa ' + rpf(d.remaining) + ' dari ' + rpf(d.amount) })) : '<div class="note">Tidak ada hutang atau piutang aktif.</div>') +
        '<div style="margin-top:10px;margin-bottom:8px"><button class="dashed" data-extra="debt">' + ic('plus', 's') + 'Catat hutang atau piutang baru</button></div>';
    }
    if (ty === 'bill') {
      const bs = unpaid();
      h += '<div class="sectitle">Tagihan ' + mName(st.month) + '</div>' + (bs.length ? choice(bs.map(b => Object.assign({ id: b.bill_id + '|' + b.period }, b)), 'bill_id', b => ({ t: b.name + (b.index ? ' (ke-' + b.index + ' dari ' + b.total + ')' : ''), s: rpf(b.amount) + ' · jatuh tempo ' + sd(b.due_date) + (b.status === 'overdue' ? ' · terlambat' : '') })) : '<div class="note">Semua tagihan bulan ini sudah lunas.</div>') +
        '<div style="margin-top:10px;margin-bottom:8px"><button class="dashed" data-extra="bill">' + ic('plus', 's') + 'Tambah tagihan atau cicilan</button></div>';
    }
    if (ty === 'invest') {
      const is = st.invest.items;
      h += '<div class="sectitle">Investasi</div>' + (is.length ? choice(is, 'invest_id', i => ({ t: i.name, s: 'Nilai ' + rpf(i.value) + ' · modal ' + rpf(i.capital) })) : '<div class="note">Belum ada investasi.</div>') +
        '<div style="margin-top:10px"><button class="dashed" data-extra="invest">' + ic('plus', 's') + 'Tambah investasi</button></div>' + seg('Setor', 'Jual') + '<div style="height:6px"></div>';
    }
    h += '<div class="infocard">';
    if (ty === 'transfer') {
      h += walletRow('Dari wallet', 'wallet_id') + walletRow('Ke wallet', 'to_wallet_id') +
        irow('receipt', 'Biaya admin (opsional)', '<input data-in="fee" inputmode="numeric" placeholder="0" value="' + (T.fee ? group(T.fee) : '') + '" autocomplete="off">');
    } else h += walletRow(walletLabel(), 'wallet_id');
    h += dateRow() + noteRow() + '</div><div style="height:12px"></div>';
    bodyEl.innerHTML = h; bodyEl.scrollTop = sc;
    saveBtn.textContent = saveLabel();
    const a = $('#amt', el); a.value = T.amount ? group(T.amount) : ''; fit();
    updateHint();
  }
  function fit() { const a = $('#amt', el); if (a) a.style.width = Math.max(3, a.value.length + 1) + 'ch'; }
  function updateHint() {
    const hint = $('#hint', el), w = walletById(T.wallet_id); if (!hint) return;
    const need = T.amount + (T.type === 'transfer' ? T.fee : 0);
    const wc = (walletById(T.wallet_id) || {}).type === 'credit', tc = T.type === 'transfer' && (walletById(T.to_wallet_id) || {}).type === 'credit';
    if (T.type === 'expense' && wc) { hint.textContent = 'Dicatat sebagai pengeluaran sekarang dan menambah utang kartu. Saat bayar tagihan nanti, jangan dicatat sebagai pengeluaran lagi.'; hint.className = 'hint'; return; }
    if (tc) { hint.textContent = 'Ini pembayaran kartu: memindahkan uang ke kartu dan mengurangi utang, bukan pengeluaran.'; hint.className = 'hint'; return; }
    hint.className = 'hint bad';
    hint.textContent = isOut() && w && w.type !== 'credit' && T.amount && w.balance < need ? 'Saldo ' + w.name + ' ' + rpf(w.balance) + ' kurang ' + rpf(need - w.balance) + '. Tetap bisa disimpan.' : '';
  }
  function chooseBill(key) {
    const parts = key.split('|'); T.bill_id = key; const b = S.st.bills.items.find(x => x.bill_id === parts[0] && x.period === parts[1]); if (!b) return;
    T.amount = b.amount; T.bill_period = b.period; if (b.wallet_id && walletById(b.wallet_id)) T.wallet_id = b.wallet_id;
    if (!T.note) T.note = '';
  }
  el.addEventListener('click', e => {
    const q = e.target.closest('[data-q]'), t = e.target.closest('[data-t]'), cat = e.target.closest('[data-cat]'), pick = e.target.closest('[data-pick]');
    if (q) { T.amount = q.dataset.q === '0' ? 0 : T.amount + (+q.dataset.q); const a = $('#amt', el); a.value = T.amount ? group(T.amount) : ''; fit(); updateHint(); return; }
    if (t) { T.type = t.dataset.t; fixCats(); fixWallet(); fixTo(); draw(); return; }
    if (cat) { T.category_id = cat.dataset.cat; draw(); return; }
    const nc = e.target.closest('[data-newcat]');
    if (nc) { categoryForm(nc.dataset.newcat, null, r => { T.category_id = r.id; draw(); }); return; }
    if (pick) {
      const k = pick.dataset.pick, v = pick.dataset.v;
      if (k === 'bill_id') chooseBill(v);
      else {
        T[k] = v;
        if (k === 'debt_id') { const d = selDebt(); if (d) T.amount = d.remaining; }
        if (k === 'goal_id' && !T.amount) { const g = S.st.goals.items.find(x => x.id === v); if (g && g.monthly_need && T.dir === 'in') T.amount = g.monthly_need; }
      }
      draw(); return;
    }
    const d = e.target.closest('[data-dir]'); if (d) { T.dir = d.dataset.dir; draw(); return; }
    const ex = e.target.closest('[data-extra]');
    if (ex) {
      const k = ex.dataset.extra;
      if (k === 'goal') goalForm(null, r => { T.goal_id = r.id; draw(); });
      else if (k === 'debt') debtForm(null, r => { T.debt_id = r.id; const dd = selDebt(); if (dd) T.amount = dd.remaining; draw(); });
      else if (k === 'bill') billForm(null, () => draw());
      else investForm(null, r => { T.invest_id = r.id; draw(); });
      return;
    }
    const dr = e.target.closest('.irow'); if (dr) { const di = $('[data-in=date]', dr); if (di && e.target === di && di.showPicker) { try { di.showPicker(); } catch (x) { /* abaikan */ } } }
    if (e.target.closest('[data-save]')) save();
  });
  el.addEventListener('input', e => {
    const tg = e.target;
    if (tg.id === 'amt') { T.amount = parseMoney(tg.value); tg.value = T.amount ? group(T.amount) : ''; fit(); updateHint(); }
    else if (tg.dataset.in === 'note') T.note = tg.value;
    else if (tg.dataset.in === 'fee') { T.fee = parseMoney(tg.value); tg.value = T.fee ? group(T.fee) : ''; updateHint(); }
  });
  el.addEventListener('change', e => {
    const tg = e.target;
    if (tg.dataset.sel) { T[tg.dataset.sel] = tg.value; if (T.type === 'transfer') fixTo(); draw(); }
    else if (tg.dataset.in === 'date' && tg.value) { T.date = tg.value; draw(); }
  });
  async function save() {
    if (!T.amount) { toast('Nominal wajib diisi.', true); return; }
    const base = { amount: T.amount, wallet_id: T.wallet_id, date: T.date, note: T.note };
    saveBtn.disabled = true;
    try {
      const ty = T.type;
      if (ty === 'expense' || ty === 'income') await act('addTransaction', Object.assign({ type: ty, category_id: T.category_id }, base), ty === 'expense' ? 'Pengeluaran disimpan' : 'Pemasukan disimpan');
      else if (ty === 'transfer') await act('addTransaction', Object.assign({ type: 'transfer', to_wallet_id: T.to_wallet_id, fee: T.fee }, base), 'Transfer disimpan');
      else if (ty === 'goal') { if (!T.goal_id) throw new Error('Pilih target dulu.'); await act('goalDeposit', Object.assign({ goal_id: T.goal_id, direction: T.dir }, base), T.dir === 'in' ? 'Setoran target disimpan' : 'Dana ditarik dari target'); }
      else if (ty === 'debt') { if (!T.debt_id) throw new Error('Pilih hutang atau piutang dulu.'); await act('payDebt', Object.assign({ debt_id: T.debt_id }, base), 'Pembayaran dicatat'); }
      else if (ty === 'bill') { if (!T.bill_id) throw new Error('Pilih tagihan dulu.'); await act('payBill', Object.assign({ bill_id: T.bill_id.split('|')[0], period: T.bill_period }, base), 'Pembayaran dicatat'); }
      else { if (!T.invest_id) throw new Error('Pilih investasi dulu.'); await act(T.dir === 'in' ? 'investDeposit' : 'investSell', Object.assign({ id: T.invest_id }, base), T.dir === 'in' ? 'Setoran investasi dicatat' : 'Penjualan dicatat'); }
      layerClose(el);
      if (monthOfDate(T.date) !== S.month) toast('Tersimpan di ' + mLong(monthOfDate(T.date)) + '.');
    } catch (err) { toast(err.message || String(err), true); }
    finally { saveBtn.disabled = false; }
  }
  fixWallet(); fixTo(); draw();
  setTimeout(() => { const a = $('#amt', el); if (a && !T.amount && matchMedia('(hover:hover)').matches) a.focus(); }, 280);
}

/* ===================== detail & edit transaksi ===================== */
function txDetail(id) {
  const t = S.st.transactions.find(x => x.id === id); if (!t) return;
  const neg = OUT_TYPES.indexOf(t.type) >= 0 || (t.type === 'adjust' && t.amount < 0);
  const rows = [['Jenis', TYPE_LABEL[t.type]], ['Tanggal', dowOf(t.date) + ', ' + sdy(t.date)], ['Wallet', t.wallet_name + (t.to_wallet_name ? ' → ' + t.to_wallet_name : '')],
    t.category_name ? ['Kategori', t.category_name] : null, t.fee ? ['Biaya admin', rpf(t.fee)] : null, t.note ? ['Catatan', t.note] : null, t.ref_period ? ['Periode', mLong(t.ref_period)] : null].filter(Boolean);
  const body = '<div style="text-align:center;margin:4px 0 18px"><span class="circ" style="margin:0 auto 10px;width:54px;height:54px">' + ic(txIcon(t), 'l') + '</span><div class="num ' + (t.type === 'income' ? 'pos' : '') + '" style="font-size:36px;font-weight:700;letter-spacing:-.03em">' +
    (t.type === 'transfer' ? rpf(t.amount) : (t.type === 'income' ? '+' : (neg ? '–' : '+')) + 'Rp ' + group(t.amount)) + '</div></div>' +
    '<div class="card flush list">' + rows.map(r => '<div class="row"><span class="muted">' + r[0] + '</span><span class="r" style="flex:1;text-align:right;white-space:normal">' + esc(r[1]) + '</span></div>').join('') + '</div>' +
    (t.editable ? '' : '<div class="note">Transaksi investasi dikelola dari halaman Invest.</div>');
  const el = sheet('Detail transaksi', body, t.editable ? '<div style="display:flex;gap:10px"><button class="btn sec2" style="flex:1" data-e="1">' + ic('pencil', 's') + 'Edit</button><button class="btn danger" style="flex:1" data-d="1">' + ic('trash', 's') + 'Hapus</button></div>' : '');
  el.addEventListener('click', e => {
    if (e.target.closest('[data-e]')) { layerClose(el); setTimeout(() => txEditForm(t), 150); }
    if (e.target.closest('[data-d]')) {
      layerClose(el);
      setTimeout(() => guard(async () => {
        const warn = t.ref_type === 'bill' ? 'Pembayaran tagihan ini akan dibatalkan.' : (t.ref_type === 'debt' ? 'Pembayaran hutang ini akan dibatalkan.' : (t.ref_type === 'goal' ? 'Setoran/penarikan target ini akan dibatalkan.' : 'Saldo wallet akan dikembalikan.'));
        if (await confirmBox('Hapus transaksi?', warn, 'Hapus')) await act('deleteTransaction', { id: t.id }, 'Transaksi dihapus');
      }), 150);
    }
  });
}
function txEditForm(t) {
  const money = t.type !== 'adjust';
  const fields = [];
  if (money) fields.push({ k: 'amount', t: 'money', label: 'Nominal', v: t.amount, req: true });
  fields.push({ k: 'wallet_id', t: 'select', label: t.type === 'transfer' ? 'Dari wallet' : 'Wallet', v: t.wallet_id, opts: walletOpts(t.wallet_id, undefined, t.type === 'expense') });
  if (t.type === 'transfer') {
    fields.push({ k: 'to_wallet_id', t: 'select', label: 'Ke wallet', v: t.to_wallet_id, opts: walletOpts(t.to_wallet_id, undefined, true) }, { k: 'fee', t: 'money', label: 'Biaya admin', v: t.fee });
  }
  if (t.type === 'expense' || t.type === 'income') fields.push({ k: 'category_id', t: 'select', label: 'Kategori', v: t.category_id, opts: S.st.categories.filter(c => c.kind === t.type && (!c.archived || c.id === t.category_id)).map(c => ({ v: c.id, l: c.name })) });
  fields.push({ k: 'date', t: 'date', label: 'Tanggal', v: t.date, req: true }, { k: 'note', t: 'text', label: 'Catatan', v: t.note, max: 120 });
  form({
    title: 'Edit ' + TYPE_LABEL[t.type].toLowerCase(), fields: fields, submit: 'Simpan perubahan',
    onSubmit: v => { const p = Object.assign({ id: t.id }, v); return act('updateTransaction', p, 'Perubahan disimpan'); }
  });
}

/* ===================== wallet ===================== */
function walletForm(w) {
  const isCard = w && w.type === 'credit';
  form({
    title: w ? (isCard ? 'Edit kartu kredit' : 'Edit wallet') : 'Wallet baru', submit: w ? 'Simpan' : 'Tambah',
    fields: [
      { k: 'name', t: 'text', label: 'Nama', v: w ? w.name : '', req: true, ph: 'mis. BCA, Gopay, Kartu Kredit BCA', max: 40 },
      { k: 'type', t: 'pills', label: 'Jenis', v: w ? w.type : 'bank', opts: [{ v: 'bank', l: 'Bank' }, { v: 'ewallet', l: 'E-wallet' }, { v: 'cash', l: 'Tunai' }, { v: 'credit', l: 'Kartu kredit' }, { v: 'other', l: 'Lainnya' }] },
      { t: 'hint', html: 'Belanja dengan kartu dicatat sebagai <b>pengeluaran</b> dan menambah utang kartu. Membayar tagihan hanya memindahkan uang dari wallet ke kartu, jadi <b>tidak dihitung pengeluaran lagi</b>.', show: v => v.type === 'credit' },
      { k: 'credit_limit', t: 'money', label: 'Limit kartu', v: w ? w.credit_limit : 0, zero: true, hint: 'Opsional. Untuk menampilkan sisa limit.', show: v => v.type === 'credit' },
      { k: 'statement_day', t: 'num', label: 'Tanggal cetak tagihan', v: w && w.statement_day ? w.statement_day : '', req: true, ph: '1-31', unit: 'tiap bulan', show: v => v.type === 'credit' },
      { k: 'due_day', t: 'num', label: 'Tanggal jatuh tempo', v: w && w.due_day ? w.due_day : '', req: true, ph: '1-31', unit: 'tiap bulan', show: v => v.type === 'credit' },
      { k: 'initial_debt', t: 'money', label: w ? 'Utang awal kartu' : 'Utang kartu saat ini', v: isCard ? Math.max(0, -w.initial_balance) : 0, zero: true,
        hint: w ? 'Utang sebelum transaksi tercatat. Untuk mencocokkan utang sekarang, pakai &quot;Sesuaikan utang&quot;.' : 'Total belanja yang belum dibayar saat ini. Isi 0 jika baru.', show: v => v.type === 'credit' },
      { k: 'initial_balance', t: 'money', label: w ? 'Saldo awal' : 'Saldo saat ini', v: w && !isCard ? w.initial_balance : 0, zero: true, hint: w ? 'Saldo awal sebelum transaksi tercatat. Untuk mencocokkan saldo sekarang, pakai &quot;Sesuaikan saldo&quot;.' : 'Saldo wallet saat ini.', show: v => v.type !== 'credit' },
      { k: 'color', t: 'swatch', label: 'Warna', v: w ? w.color : WALLET_COLORS[0], opts: WALLET_COLORS }
    ],
    onSubmit: v => {

  d.classList.toggle('open', open); f.classList.toggle('open', open);
}
function monthPop() {
  let yr = +S.month.slice(0, 4);
  const el = layerOpen('<div class="popcard"></div>', 'monthl'), cur = S.st.current_month;
  const draw = () => { $('.popcard', el).innerHTML = '<div class="yr"><button class="iconbtn" data-yd="-1" aria-label="Tahun sebelumnya">' + ic('chevL') + '</button><span>' + yr + '</span><button class="iconbtn" data-yd="1" aria-label="Tahun berikutnya">' + ic('chevR') + '</button></div><div class="mgrid">' +
    MON.map((m, i) => { const k = yr + '-' + pad(i + 1); return '<button data-m="' + k + '" class="' + (k === S.month ? 'on' : '') + ' ' + (k === cur ? 'now' : '') + '">' + m + '</button>'; }).join('') + '</div>'; };
  draw();
  el.addEventListener('click', e => {
    const y = e.target.closest('[data-yd]'); if (y) { yr += +y.dataset.yd; draw(); return; }
    const m = e.target.closest('[data-m]'); if (m) { layerClose(el); guard(() => loadState(m.dataset.m)); }
  });
}

    title: 'Hapus semua data', submit: 'Hapus permanen',
    fields: [{ t: 'hint', bad: true, html: 'Semua wallet, transaksi, budget, tagihan, hutang, target dan investasi akan dihapus <b>permanen</b>. Ketik <b>HAPUS</b> untuk melanjutkan.' }, { k: 'c', t: 'text', label: 'Konfirmasi', v: '', ph: 'HAPUS' }],
    onSubmit: async v => { if (String(v.c).trim().toUpperCase() !== 'HAPUS') throw new Error('Ketik HAPUS untuk konfirmasi.'); await act('resetData', {}, 'Data dikosongkan'); S.stack = []; S.tab = 'home'; S.keepTop = true; render(); }
  })
};
const CHG = {
  g: v => { S.f.g = v; render(); }, c: v => { S.f.c = v; render(); }, w: v => { S.f.w = v; render(); }
};

/* ===================== event global ===================== */
document.addEventListener('click', e => {
  chartPointer(e);
  if (e.target.id === 'dial' || (e.target.classList && e.target.classList.contains('list2'))) { toggleDial(false); return; }
  const x = e.target.closest('[data-x]');
  if (x) { layerClose(x.closest('.layer')); return; }
  const a = e.target.closest('[data-a]'); if (!a) return;
  const fn = A[a.dataset.a]; if (fn) guard(() => fn(a.dataset, a, e));
});
document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') chartPointer(e); });
document.addEventListener('change', e => { const c = e.target.dataset && e.target.dataset.chg; if (c && CHG[c]) CHG[c](e.target.value); });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.f.q = e.target.value; const b = $('#txbody'); if (b) b.innerHTML = txBodyHtml(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const l = $('#layer').lastElementChild; if (l) layerClose(l); else toggleDial(false); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
});

/* ===================== login PIN ===================== */
const LK = { pin: '', err: '', busy: false, left: 0, t: null };
function lockEl() { let el = $('#lock'); if (!el) { el = document.createElement('div'); el.id = 'lock'; document.body.appendChild(el); } return el; }
function hideLock() { const el = $('#lock'); if (el) el.remove(); clearInterval(LK.t); }
function showLock(code, msg, left) {
  S.token = null; ls('tok', ''); S.st = null; S.stack = []; S.tab = 'home'; closeAllLayers(); LK.pin = ''; LK.err = msg && code === 'AUTH' ? msg : ''; LK.left = left || 0;
  try { document.activeElement.blur(); } catch (e) { /* abaikan */ }
  const el = lockEl();
  if (code === 'NO_PIN') {
    el.innerHTML = '<div class="lk"><div class="lk-logo">' + LOGO + '</div><h2>PIN belum diatur</h2><p class="muted">Demi keamanan, PIN pertama hanya bisa dibuat oleh pemilik aplikasi:</p>' +
      '<ol class="lk-steps"><li>Buka Google Sheet aplikasi ini</li><li>Menu <b>Keuangan → Atur / ganti PIN</b></li><li>Masukkan PIN 4–12 angka, lalu muat ulang halaman ini</li></ol><button class="btn" data-a="retry">Muat ulang</button></div>';
    return;
  }
  clearInterval(LK.t);
  if (LK.left > 0) LK.t = setInterval(() => { LK.left--; if (LK.left <= 0) { clearInterval(LK.t); LK.err = ''; } drawLock(); }, 1000);
  el.innerHTML = '<div class="lk"><div class="lk-logo">' + LOGO + '</div><h2>Masukkan PIN</h2><div class="lk-dots" id="lkdots"></div><div class="lk-err" id="lkerr"></div>' +
    '<div class="lk-pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button data-a="pk" data-d="' + n + '">' + n + '</button>').join('') +
    '<button data-a="pk" data-d="del" aria-label="Hapus">' + ic('x', 's') + '</button><button data-a="pk" data-d="0">0</button><button class="go" data-a="pk" data-d="ok" aria-label="Masuk">' + ic('check', 's') + '</button></div></div>';
  drawLock();
}
function drawLock() {
  const d = $('#lkdots'); if (!d) return;
  const n = Math.max(4, LK.pin.length);
  d.innerHTML = Array.from({ length: n }, (_, i) => '<i class="' + (i < LK.pin.length ? 'on' : '') + '"></i>').join('');
  const e = $('#lkerr');
  e.textContent = LK.left > 0 ? 'Terkunci. Coba lagi dalam ' + Math.floor(LK.left / 60) + ':' + pad(LK.left % 60) : LK.err;
  $$('#lock .lk-pad button').forEach(b => { b.disabled = LK.left > 0 || LK.busy; });
}
async function lockSubmit() {
  if (LK.busy || LK.left > 0) return;
  if (LK.pin.length < 4) { LK.err = 'PIN minimal 4 angka.'; return drawLock(); }
  LK.busy = true; LK.err = ''; drawLock();
  try {
    const r = await raw('login', { pin: LK.pin }, null);
    if (r && r.ok) { S.token = r.result.token; ls('tok', S.token); hideLock(); LK.pin = ''; LK.busy = false; boot(); return; }
    LK.err = (r && r.error) || 'Gagal masuk.';
    if (/Terkunci|Terlalu banyak/.test(LK.err)) { LK.left = 300; LK.err = ''; clearInterval(LK.t); LK.t = setInterval(() => { LK.left--; if (LK.left <= 0) { clearInterval(LK.t); LK.left = 0; } drawLock(); }, 1000); }
  } catch (e) { LK.err = e.message; }
  LK.busy = false; LK.pin = ''; drawLock();
  const dd = $('#lkdots'); if (dd) { dd.classList.remove('shake'); void dd.offsetWidth; dd.classList.add('shake'); }
}
A.pk = d => {
  if (d && typeof d === 'object') d = d.d;   // klik keypad mengirim dataset; keyboard mengirim string
  d = String(d);
  if (LK.busy || LK.left > 0) return;
  if (d === 'del') LK.pin = LK.pin.slice(0, -1);
  else if (d === 'ok') return lockSubmit();
  else if (LK.pin.length < 12) LK.pin += d;
  LK.err = ''; drawLock();
};
document.addEventListener('keydown', e => {
  if (!$('#lock') || !$('#lkdots')) return;
  if (e.key === 'Enter' || e.key === ' ') e.preventDefault();
  if (/^\d$/.test(e.key)) A.pk(e.key); else if (e.key === 'Backspace') A.pk('del'); else if (e.key === 'Enter') A.pk('ok');
});
A.lock = async () => {
  try { await raw('logout', {}, null); } catch (e) { /* tetap kunci di sisi klien */ }
  showLock('LOGIN', '');
};
A.set_pin = () => {
  const f = (id, label) => '<div class="fld"><label class="muted sm">' + label + '</label><div class="inp"><input id="' + id + '" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••••"></div></div>';
  const el = sheet('Ubah PIN', '<p class="muted sm" style="margin:0 0 12px">PIN 4–12 angka. Setelah diganti, perangkat lain harus login ulang.</p>' + f('pn_old', 'PIN lama') + f('pn_new', 'PIN baru') + f('pn_new2', 'Ulangi PIN baru'), '<button class="btn" style="width:100%" data-a="pin_save">Simpan PIN</button>');
  el.id = 'pinsheet';
};
A.pin_save = () => guard(async () => {
  const o = $('#pn_old').value, n = $('#pn_new').value, n2 = $('#pn_new2').value;
  if (!/^\d{4,12}$/.test(n)) throw new Error('PIN baru harus 4-12 angka.');
  if (n !== n2) throw new Error('Pengulangan PIN baru tidak sama.');
  const r = await raw('changePin', { old_pin: o, new_pin: n });
  if (!r.ok) throw new Error(r.error);
  S.token = r.result.token; ls('tok', S.token);
  closeAllLayers(); toast('PIN diganti');
});

/* ===================== boot ===================== */
function connectScreen(msg) {
  $('#app').innerHTML = '<div class="err" style="text-align:left;max-width:420px;margin:0 auto;padding:28px 20px">' + ic('ext', 'l') +
    '<p style="margin:14px 0 6px;font-weight:700;color:var(--text);font-size:18px">Hubungkan ke Google Sheet-mu</p>' +
    '<p style="margin:0 0 14px">Tempel URL Web App hasil deploy (berakhiran <b>/exec</b>). Datamu tetap di Google Sheet milikmu sendiri.</p>' +
    (msg ? '<p style="color:var(--neg);margin:0 0 10px">' + esc(msg) + '</p>' : '') +
    '<div class="inp"><input id="apiurl" style="flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(apiUrl()) + '" autocomplete="off" autocapitalize="off" spellcheck="false"></div>' +
    '<button class="btn" style="width:100%;margin-top:14px" data-a="saveurl">Hubungkan</button></div>';
}
A.saveurl = () => {
  const v = ($('#apiurl').value || '').trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/(exec|dev)$/.test(v)) return connectScreen('URL tidak valid. Harus berupa https://script.google.com/macros/s/…/exec');
  try { localStorage.setItem('api_url', v); } catch (e) {}
  boot();
};
A.changeurl = () => connectScreen();
async function boot() {
  applyTheme(); S.hide = ls('hide') === '1'; S.token = ls('tok') || null;
  try { const q = new URLSearchParams(location.search).get('api'); if (q && HOSTED) { localStorage.setItem('api_url', q); history.replaceState(null, '', location.pathname); } } catch (e) {}
  if (HOSTED && !apiUrl()) return connectScreen();
  $('#app').innerHTML = '<div class="top"><div class="logo-wrap">' + LOGO + '</div></div><div class="skel"></div><div class="skel" style="height:90px"></div><div class="skel" style="height:200px"></div>';
  try {
    const a = await raw('authStatus', {}, null);
    if (!a.ok) throw new Error(a.error || 'Gagal memeriksa login.');
    if (!a.result.has_pin) return showLock('NO_PIN');
    if (!a.result.authed) return showLock('LOGIN', '', a.result.locked_seconds);
    hideLock();
    await loadState(null);
  }
  catch (e) { if (!$('#lkdots') && !$('#lock')) $('#app').innerHTML = '<div class="err">' + ic('alert', 'l') + '<p style="margin:12px 0 4px;font-weight:700;color:var(--text)">Tidak bisa memuat data</p><p style="margin:0 0 18px">' + esc(e.message) + '</p><button class="btn" data-a="retry">Coba lagi</button></div>'; }
}
A.retry = () => boot();
if (HOSTED && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
boot();
</script>

</body>
